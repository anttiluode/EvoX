name: freeze-v2-result

on:
  push:
    branches: [evox-v2-unlabeled-behavior]
    paths:
      - .v2-freeze-trigger

permissions:
  actions: read
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evox-v2-unlabeled-behavior
      - name: Download exact canonical artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/evox-v2-artifact
          mkdir -p /tmp/evox-v2-artifact
          gh run download 35071529706 \
            --repo anttiluode/EvoX \
            --name evox-v2-a02bf250d0516e62c8a2d816e6dbd7c585ac64ad \
            --dir /tmp/evox-v2-artifact
          test -f /tmp/evox-v2-artifact/v2_behavioral.json
          python - <<'PY'
          import hashlib
          p='/tmp/evox-v2-artifact/v2_behavioral.json'
          data=open(p,'rb').read()
          print('bytes', len(data))
          print('sha256', hashlib.sha256(data).hexdigest())
          PY
          cp /tmp/evox-v2-artifact/v2_behavioral.json results/v2_behavioral.json
      - name: Commit exact receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/v2_behavioral.json
          git commit -m 'results: replace summary with exact V2 canonical receipt'
          git push origin HEAD:evox-v2-unlabeled-behavior
