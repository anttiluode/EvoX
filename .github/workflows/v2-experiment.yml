name: v2-experiment

on:
  push:
    branches: [evox-v2-unlabeled-behavior]
    paths:
      - .v2-experiment-trigger

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Run frozen V2 sweep
        shell: bash
        run: |
          mode="$(tr -d '\r\n ' < .v2-experiment-trigger)"
          if [ "$mode" = "pilot" ]; then
            python -m experiments.run_v2_behavioral --seed-start 500 --seed-count 8 --out results/v2_pilot.json
            echo "RESULT=results/v2_pilot.json" >> "$GITHUB_ENV"
          elif [ "$mode" = "canonical" ]; then
            python -m experiments.run_v2_behavioral --seed-start 600 --seed-count 32 --out results/v2_behavioral.json
            echo "RESULT=results/v2_behavioral.json" >> "$GITHUB_ENV"
          else
            echo "Unknown experiment trigger: $mode" >&2
            exit 2
          fi
      - name: Show summary
        run: python - <<'PY'
          import json, os
          d=json.load(open(os.environ['RESULT']))
          print(json.dumps(d['summaries'], indent=2, sort_keys=True))
          print(json.dumps(d['classifications'], indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: evox-v2-${{ github.sha }}
          path: ${{ env.RESULT }}
